name: Build & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GCP_REGION: us-central1
  GAR_REGISTRY: us-central1-docker.pkg.dev
  GAR_REPOSITORY: services
  IMAGE_NAME: my-service
  GKE_CLUSTER: dev-gke-cluster
  GKE_CLUSTER_PROD: prod-gke-cluster

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix app
      - name: Lint
        run: npm run lint --prefix app
      - name: Test
        run: npm test --prefix app

  image-build:
    name: Verify Docker image (no GCP)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker build -f docker/Dockerfile -t my-service:ci ./app

  build:
    name: Publish to Artifact Registry
    runs-on: ubuntu-latest
    needs: image-build
    # Opt in only after repository secrets, Artifact Registry and GKE are configured.
    if: github.event_name == 'push' && vars.GCP_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
      full_image: ${{ steps.meta.outputs.full_image }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate GCP publishing configuration
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          SA_EMAIL: ${{ secrets.GCP_SA_EMAIL }}
        run: |
          if [[ -z "$PROJECT_ID" || -z "$WIF_PROVIDER" || -z "$SA_EMAIL" ]]; then
            echo "::error::GCP_DEPLOY_ENABLED=true but GCP_PROJECT_ID, GCP_WIF_PROVIDER or GCP_SA_EMAIL is missing from repository Actions secrets."
            exit 1
          fi
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "$GAR_REGISTRY" --quiet
      - name: Generate image metadata
        id: meta
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          SHA_TAG="${GITHUB_SHA::8}"
          FULL_IMAGE="${GAR_REGISTRY}/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.full_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}
      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.sha_tag }}
          format: table
          exit-code: '1'
          severity: CRITICAL

  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && vars.GCP_DEPLOY_ENABLED == 'true'
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.4.2'
      - name: Apply dev overlay
        run: |
          kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -
          cd k8s/overlays/dev
          kustomize edit set image "${{ env.IMAGE_NAME }}=${{ needs.build.outputs.full_image }}:${{ needs.build.outputs.image_tag }}"
          kustomize build . | kubectl apply -f -
      - name: Wait for rollout
        run: kubectl rollout status deployment/dev-my-service -n dev --timeout=300s
      - name: Run deployment health checks
        run: bash scripts/health-check.sh dev-my-service dev

  deploy-prod:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROD_DEPLOY_ENABLED == 'true'
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate production GCP configuration
        env:
          WIF_PROVIDER_PROD: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          SA_EMAIL_PROD: ${{ secrets.GCP_SA_EMAIL_PROD }}
        run: |
          if [[ -z "$WIF_PROVIDER_PROD" || -z "$SA_EMAIL_PROD" ]]; then
            echo "::error::GCP_PROD_DEPLOY_ENABLED=true but GCP_WIF_PROVIDER_PROD or GCP_SA_EMAIL_PROD is missing from the prod environment/repository."
            exit 1
          fi
      - name: Authenticate to GCP (prod)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SA_EMAIL_PROD }}
      - name: Get GKE credentials (prod)
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_PROD }}
          location: ${{ env.GCP_REGION }}
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Install Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.4.2'
      - name: Apply prod overlay
        run: |
          kubectl create namespace prod --dry-run=client -o yaml | kubectl apply -f -
          cd k8s/overlays/prod
          kustomize edit set image "${{ env.IMAGE_NAME }}=${{ needs.build.outputs.full_image }}:${{ needs.build.outputs.image_tag }}"
          kustomize build . | kubectl apply -f -
      - name: Wait for rollout
        run: kubectl rollout status deployment/my-service -n prod --timeout=600s
      - name: Verify deployment
        run: bash scripts/health-check.sh my-service prod
      - name: Annotate Datadog deployment event (optional)
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: |
          if [[ -z "$DATADOG_API_KEY" ]]; then
            echo 'DATADOG_API_KEY unset; skipping optional Datadog event'
            exit 0
          fi
          curl --fail-with-body -X POST https://api.datadoghq.com/api/v1/events \
            -H "DD-API-KEY: ${DATADOG_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"title":"Deployment: my-service","text":"Deployed my-service:${{ needs.build.outputs.image_tag }} to prod","tags":["env:prod","service:my-service","version:${{ needs.build.outputs.image_tag }}"],"alert_type":"info"}'
