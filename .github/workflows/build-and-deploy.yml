name: "Build & Deploy"

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - ".github/CODEOWNERS"
  pull_request:
    branches: [main]

env:
  GCP_REGION: us-central1
  GCR_REGISTRY: gcr.io
  IMAGE_NAME: my-service                         # ← change to your service name
  GKE_CLUSTER: dev-gke-cluster
  GKE_CLUSTER_PROD: prod-gke-cluster
  K8S_NAMESPACE: default

jobs:
  ##############################################################################
  # 1. Test & Lint
  ##############################################################################
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js        # ← swap for your runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Run linter
        run: npm run lint --prefix app

      - name: Run tests
        run: npm test --prefix app

  ##############################################################################
  # 2. Build & Push Docker Image
  ##############################################################################
  build:
    name: "Build & Push"
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker ${{ env.GCR_REGISTRY }} --quiet

      - name: Generate image metadata
        id: meta
        run: |
          SHA_TAG="${GITHUB_SHA::8}"
          PROJECT_ID="${{ secrets.GCP_PROJECT_ID }}"
          FULL_IMAGE="${{ env.GCR_REGISTRY }}/${PROJECT_ID}/${{ env.IMAGE_NAME }}"
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "full_image=${FULL_IMAGE}" >> $GITHUB_OUTPUT
          echo "Image: ${FULL_IMAGE}:${SHA_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.sha_tag }}
            ${{ steps.meta.outputs.full_image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.sha_tag }}"
          format: "table"
          exit-code: "1"           # Fail on CRITICAL CVEs
          severity: "CRITICAL"

  ##############################################################################
  # 3. Deploy to Dev
  ##############################################################################
  deploy-dev:
    name: "Deploy → dev"
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment: dev
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GCP_REGION }}

      - name: Deploy with Kustomize (dev overlay)
        run: |
          cd k8s/overlays/dev
          kustomize edit set image \
            ${{ env.IMAGE_NAME }}=${{ needs.build.outputs.full_image }}:${{ needs.build.outputs.image_tag }}
          kustomize build . | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} \
            -n ${{ env.K8S_NAMESPACE }} --timeout=300s

      - name: Run health check
        run: |
          bash scripts/health-check.sh \
            ${{ env.IMAGE_NAME }} \
            ${{ env.K8S_NAMESPACE }}

  ##############################################################################
  # 4. Deploy to Prod (main branch only, requires approval)
  ##############################################################################
  deploy-prod:
    name: "Deploy → prod"
    runs-on: ubuntu-latest
    needs: [build, deploy-dev]
    if: github.ref == 'refs/heads/main'
    environment: prod                              # Requires manual approval
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (prod SA)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SA_EMAIL_PROD }}

      - name: Get GKE credentials (prod)
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER_PROD }}
          location: ${{ env.GCP_REGION }}

      - name: Deploy with Kustomize (prod overlay)
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            ${{ env.IMAGE_NAME }}=${{ needs.build.outputs.full_image }}:${{ needs.build.outputs.image_tag }}
          kustomize build . | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.IMAGE_NAME }} \
            -n ${{ env.K8S_NAMESPACE }} --timeout=600s

      - name: Verify deployment
        run: |
          bash scripts/health-check.sh \
            ${{ env.IMAGE_NAME }} \
            ${{ env.K8S_NAMESPACE }}

      - name: Annotate Datadog deployment event
        run: |
          curl -X POST "https://api.datadoghq.com/api/v1/events" \
            -H "DD-API-KEY: ${{ secrets.DATADOG_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "title": "Deployment: ${{ env.IMAGE_NAME }}",
              "text": "Deployed ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }} to prod by ${{ github.actor }}",
              "tags": ["env:prod","service:${{ env.IMAGE_NAME }}","version:${{ needs.build.outputs.image_tag }}"],
              "alert_type": "info"
            }'
