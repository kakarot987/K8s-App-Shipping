##############################################################################
# k8s/base/hpa.yaml — Horizontal Pod Autoscaler
##############################################################################
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
##############################################################################
# k8s/base/pdb.yaml — Pod Disruption Budget (always keep 1 pod alive)
##############################################################################
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: my-service-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: my-service
---
##############################################################################
# k8s/base/serviceaccount.yaml — Workload Identity binding
##############################################################################
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-service-sa
  annotations:
    # Replace with your GCP SA for Workload Identity
    iam.gke.io/gcp-service-account: my-service@PROJECT_ID.iam.gserviceaccount.com
---
##############################################################################
# k8s/base/configmap.yaml — Non-sensitive configuration
##############################################################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-service-config
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
