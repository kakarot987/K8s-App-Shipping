apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: my-service-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: my-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-service-sa
  # Add a real iam.gke.io/gcp-service-account annotation only if required.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: my-service-config
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  PORT: "3000"
