##############################################################################
# helm/values.yaml — Default values (overridden by values-dev/prod.yaml)
##############################################################################

replicaCount: 2

image:
  repository: gcr.io/my-project/my-service
  tag: "latest"       # Overridden by CI: --set image.tag=<GIT_SHA>
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: my-service.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  NODE_ENV: production
  LOG_LEVEL: info
  PORT: "3000"

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3000"
  prometheus.io/path: "/metrics"

serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: ""  # Set per environment

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true

datadog:
  enabled: true
  env: production
  service: my-service
